<title>J.A.R.V.I.S. · Kilitli</title>
<style>
:root{--bg:#020c18;--accent:#4fd6ff;--accent2:#1b78ff;--hot:#bff2ff;--text:#e4f7ff;--muted:#88aec9;--danger:#ff6b7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.lc{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.rg{width:min(52vw,210px);height:auto}
.sp{transform-box:view-box;transform-origin:100px 100px}
@keyframes r{to{transform:rotate(360deg)}}@keyframes rr{to{transform:rotate(-360deg)}}
.r1{animation:r 24s linear infinite}.r2{animation:rr 14s linear infinite}.r3{animation:r 7s linear infinite}
.fast .r1{animation-duration:3s}.fast .r2{animation-duration:2s}.fast .r3{animation-duration:1s}
.nm{font-size:28px;font-weight:800;letter-spacing:3px;text-shadow:0 0 18px rgba(79,214,255,.7)}
.st{font-size:12px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;min-height:16px}
form{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:14px}
input[type=password]{width:100%;padding:15px 16px;border-radius:14px;border:1px solid rgba(79,214,255,.45);background:rgba(6,40,74,.55);color:var(--text);font-size:17px;text-align:center;letter-spacing:4px;outline:none;transition:box-shadow .3s,border-color .3s;font-family:inherit}
input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 22px -4px rgba(79,214,255,.8)}
input.bad{border-color:var(--danger)!important;box-shadow:0 0 22px -4px rgba(255,107,122,.9)!important;animation:sh .35s}
@keyframes sh{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.rm{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.rm input{accent-color:var(--accent);width:17px;height:17px}
button{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--accent2),var(--accent));color:#02101f;font-size:16px;font-weight:800;letter-spacing:1px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 0 26px -6px var(--accent);font-family:inherit}
button::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:gl 2.8s ease-in-out infinite}
@keyframes gl{60%,100%{left:120%}}
button:disabled{opacity:.7}
.ok{position:fixed;inset:0;z-index:2;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:radial-gradient(circle,rgba(27,120,255,.35),rgba(2,12,24,1) 62%),#020c18}
.ok b{font-size:20px;letter-spacing:4px;color:var(--hot)}
.ok span{color:var(--muted);font-size:14px}
.ok.on{display:flex;animation:fi .5s ease-out}
@keyframes fi{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sp,button::after{animation:none}}
</style>
</head>
