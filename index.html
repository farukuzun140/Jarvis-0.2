<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>JARVIS · Kilitli</title>
<style>
:root{--bg:#010c18;--bg2:#0a3a6b;--accent:#4fdcff;--text:#e4f7ff;--muted:#7fa6c2;--line:rgba(79,220,255,.25);--danger:#ff6b7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse 80% 55% at 50% 40%,var(--bg2),var(--bg) 75%);color:var(--text);
  font-family:"Chakra Petch",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
form{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ring{width:110px;height:110px;border-radius:50%;border:3px dashed var(--accent);display:grid;place-items:center;box-shadow:0 0 30px -6px var(--accent)}
.ring svg{width:40px;height:40px}
h1{margin:6px 0 0;font-size:1.5rem;letter-spacing:.3em;padding-left:.3em}
p{margin:0;color:var(--muted);line-height:1.45}
input[type=password]{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(6,40,74,.6);color:var(--text);font-size:1.05rem;outline:none;text-align:center}
input[type=password]:focus{border-color:var(--accent)}
label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.92rem}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--bg);font-weight:700;font-size:1.05rem;cursor:pointer}
.err{color:var(--danger);min-height:1.3em;font-size:.92rem}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>JARVIS</h1>
  <p>Bu asistan kilitli. Devam etmek için şifreni gir.</p>
  <input id="pw" type="password" placeholder="Şifre" aria-label="Şifre" autocomplete="current-password">
  <label><input type="checkbox" id="rem" checked> Bu cihazda hatırla</label>
  <button type="submit" id="btn">Kilidi aç</button>
  <div class="err" id="err" role="alert"></div>
</form>

/* büyük/küçük harf, Türkçe I/İ/ı ve fazla boşluk farkı önemsiz */
function normPw(s){return s.trim().replace(/\s+/g," ").replace(/[İIı]/g,"i").toLowerCase()}
function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
function show(html){document.open();document.write(html);document.close()}
async function decryptWith(key){
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
  return new TextDecoder().decode(pt);
}
async function keyFromPw(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
/* hatırlanan anahtar varsa doğrudan aç */
(async function(){
  try{var saved=localStorage.getItem(KEY);if(!saved)return;
    var k=await crypto.subtle.importKey("raw",b64(saved),{name:"AES-GCM"},false,["decrypt"]);
    show(await decryptWith(k));
  }catch(e){try{localStorage.removeItem(KEY)}catch(_){}}
})();
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();
  var pw=normPw(document.getElementById("pw").value),err=document.getElementById("err"),btn=document.getElementById("btn");
  if(!pw){err.textContent="Şifreyi gir.";return}
  if(!window.crypto||!crypto.subtle){err.textContent="Bu tarayıcı şifre çözmeyi desteklemiyor. Safari veya Chrome kullan.";return}
  btn.disabled=true;btn.textContent="Açılıyor…";err.textContent="";
  try{
    var k=await keyFromPw(pw),html=await decryptWith(k);
    if(document.getElementById("rem").checked){try{var raw=new Uint8Array(await crypto.subtle.exportKey("raw",k));var s="";raw.forEach(function(x){s+=String.fromCharCode(x)});localStorage.setItem(KEY,btoa(s))}catch(_){}}
    show(html);
  }catch(x){err.textContent="Şifre yanlış. Tekrar dene.";btn.disabled=false;btn.textContent="Kilidi aç"}
});
})();
</script>
